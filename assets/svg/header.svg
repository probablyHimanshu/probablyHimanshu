<svg width="1000" height="260" viewBox="0 0 1000 260"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1230"/>
      <stop offset="50%" stop-color="#111b46"/>
      <stop offset="100%" stop-color="#0c1432"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4d73ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff4fd8"/>
    </linearGradient>

    <radialGradient id="orb">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#9b5cff"/>
      <stop offset="55%" stop-color="#5d7cff"/>
      <stop offset="100%" stop-color="#17224d"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <style>
      .title {
        font-family: Arial, Helvetica, sans-serif;
        fill: #ffffff;
      }

      .muted {
        font-family: Arial, Helvetica, sans-serif;
        fill: #8e9bc7;
      }

      .small {
        font-family: Arial, Helvetica, sans-serif;
        fill: #6575aa;
      }

      .mono {
        font-family: monospace;
        fill: #7385bd;
      }
    </style>

  </defs>


  <!-- Background -->

  <rect
    x="2"
    y="2"
    width="996"
    height="256"
    rx="24"
    fill="url(#bg)"
    stroke="#4966c9"
    stroke-width="2"
  />


  <!-- Decorative glow -->

  <circle
    cx="835"
    cy="45"
    r="75"
    fill="#5d7cff"
    opacity="0.08"
    filter="url(#softGlow)"
  />

  <circle
    cx="145"
    cy="220"
    r="65"
    fill="#a855f7"
    opacity="0.07"
    filter="url(#softGlow)"
  />


  <!-- Top accent -->

  <rect
    x="25"
    y="25"
    width="950"
    height="2"
    rx="2"
    fill="url(#accent)"
  />


  <!-- Status indicator -->

  <circle
    cx="45"
    cy="55"
    r="5"
    fill="#45e6a6"
    filter="url(#glow)"
  />

  <text
    x="60"
    y="59"
    class="small"
    font-size="10">
    SYSTEM ONLINE
  </text>


  <!-- Main identity -->

  <text
    x="40"
    y="112"
    class="title"
    font-size="42"
    font-weight="bold"
    letter-spacing="2">
    HIMANSHU
  </text>

  <text
    x="42"
    y="143"
    class="muted"
    font-size="16"
    letter-spacing="1">
    DATA ANALYST • CYBER SECURITY LEARNER
  </text>


  <!-- Description -->

  <text
    x="42"
    y="174"
    class="small"
    font-size="11">
    DATA • DEVELOPMENT • SECURITY • AI
  </text>


  <!-- Code decoration -->

  <text
    x="42"
    y="207"
    class="mono"
    font-size="12">
    &lt;/&gt; BUILD • ANALYZE • SECURE • LEARN
  </text>


  <!-- Right side orbital core -->

  <ellipse
    cx="830"
    cy="130"
    rx="108"
    ry="43"
    fill="none"
    stroke="#425cae"
    stroke-width="1"
    opacity="0.65"
    transform="rotate(-18 830 130)"
  />

  <ellipse
    cx="830"
    cy="130"
    rx="90"
    ry="35"
    fill="none"
    stroke="#704fc4"
    stroke-width="1"
    opacity="0.65"
    transform="rotate(35 830 130)"
  />

  <ellipse
    cx="830"
    cy="130"
    rx="110"
    ry="28"
    fill="none"
    stroke="#3d72dc"
    stroke-width="1"
    opacity="0.5"
    transform="rotate(70 830 130)"
  />


  <!-- Orbit nodes -->

  <circle
    cx="742"
    cy="103"
    r="5"
    fill="#5d7cff"
    filter="url(#glow)"
  />

  <circle
    cx="910"
    cy="105"
    r="5"
    fill="#ff4fd8"
    filter="url(#glow)"
  />

  <circle
    cx="790"
    cy="176"
    r="5"
    fill="#a855f7"
    filter="url(#glow)"
  />

  <circle
    cx="883"
    cy="181"
    r="5"
    fill="#45e6a6"
    filter="url(#glow)"
  />


  <!-- Central core -->

  <circle
    cx="830"
    cy="130"
    r="30"
    fill="#5d7cff"
    opacity="0.18"
    filter="url(#softGlow)"
  />

  <circle
    cx="830"
    cy="130"
    r="25"
    fill="url(#orb)"
    stroke="#8f79ff"
    stroke-width="2"
    filter="url(#glow)"
  />

  <text
    x="830"
    y="138"
    text-anchor="middle"
    font-family="monospace"
    font-size="17"
    font-weight="bold"
    fill="#ffffff">
    &lt;/&gt;
  </text>


  <!-- Bottom accent -->

  <line
    x1="40"
    y1="232"
    x2="960"
    y2="232"
    stroke="#263866"
    stroke-width="1"
  />

  <text
    x="40"
    y="247"
    class="small"
    font-size="9">
    GITHUB PROFILE // DEVELOPER IDENTITY
  </text>

  <text
    x="960"
    y="247"
    text-anchor="end"
    class="small"
    font-size="9">
    2026
  </text>

</svg>