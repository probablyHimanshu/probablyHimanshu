  </text>

  <text
    x="75"
    y="280"
    class="small"
    font-size="9">
    SEARCH • WEB DEVELOPMENT
  </text>

  <text
    x="350"
    y="262"
    class="muted"
    font-size="11">
    Private search experience with
  </text>

  <text
    x="350"
    y="279"
    class="muted"
    font-size="11">
    a custom search-focused interface.
  </text>

  <text
    x="770"
    y="270"
    class="tech"
    font-size="11">
    React • JavaScript
  </text>


  <!-- Project 3 -->

  <rect
    x="30"
    y="310"
    width="940"
    height="65"
    rx="10"
    fill="#0e1839"
    stroke="#263b75"
  />

  <circle
    cx="55"
    cy="342"
    r="7"
    fill="#ff4fd8"
    filter="url(#glow)"
  />

  <text
    x="75"
    y="337"
