    font-size="14">
    Civic Management System
  </text>

  <text
    x="75"
    y="355"
    class="small"
    font-size="9">
    FULL STACK • CLOUD
  </text>

  <text
    x="350"
    y="337"
    class="muted"
    font-size="11">
    Web platform for reporting and
  </text>

  <text
    x="350"
    y="354"
    class="muted"
    font-size="11">
    managing civic issues digitally.
  </text>

  <text
    x="770"
    y="345"
    class="tech"
    font-size="11">
    React • Cloud • Git
  </text>


  <!-- Project 4 -->

  <rect
    x="30"
    y="385"
    width="940"
    height="1"
    fill="#273866"
